name: evaluation-service CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service-ci.yml"
  push:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service-ci.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: evaluation-service
  SERVICE_DIR: evaluation-service
  GOFLAGS: -mod=mod

jobs:
  build_test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Download dependencies
        run: go mod download
      - name: Ensure module metadata
        run: go mod tidy
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./...

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    needs: build_test
    continue-on-error: true
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Download dependencies
        run: go mod download
      - name: Ensure module metadata
        run: go mod tidy
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
          working-directory: ${{ env.SERVICE_DIR }}

  security:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [build_test, lint]
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Download dependencies
        run: go mod download
      - name: Ensure module metadata
        run: go mod tidy
      - name: SCA (Trivy fs) - fail on CRITICAL
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SERVICE_DIR }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SAST (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

  docker_build_push:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [build_test, security]
    if: ${{ always() && needs.build_test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set image tag
        id: vars
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          docker build -t "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}" "./${{ env.SERVICE_DIR }}"
      - name: Container scan (Trivy image) - fail on CRITICAL
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push image
        run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}"
  update_manifest:
    name: Update Deployment Manifest Tag
    runs-on: ubuntu-latest
    needs: docker_build_push
    if: ${{ always() && needs.docker_build_push.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag
        id: vars
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Update deployment image tag
        run: |
          sed -Ei "s|(image:[[:space:]]+.+/${ECR_REPOSITORY}:).*|\1${{ steps.vars.outputs.tag }}|" "${SERVICE_DIR}/k8s/deployment.yaml"
          grep -n "image:" "${SERVICE_DIR}/k8s/deployment.yaml"
      - name: Commit deployment tag update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${SERVICE_DIR}/k8s/deployment.yaml"
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "ci(${SERVICE_DIR}): update image tag to ${{ steps.vars.outputs.tag }}"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Failed to push manifest update after retries."
          exit 1
